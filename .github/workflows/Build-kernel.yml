name: Build Kernel with KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: "Kernel source repo (user/repo)"
        required: true
        default: "tiann/KernelSU"
      KERNEL_BRANCH:
        description: "Kernel source branch"
        required: true
        default: "main"
      KERNEL_DEFCONFIG:
        description: "Defconfig name (e.g. vendor/lahaina-qgki_defconfig)"
        required: true
        default: "gki_defconfig"
      ARCH:
        description: "Architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x86_64
      ANDROID_VERSION:
        description: "Android version (e.g. android14)"
        required: true
        default: "android14"
      KERNEL_VERSION:
        description: "Kernel version (e.g. 6.1)"
        required: true
        default: "6.1"
      CLANG_VERSION:
        description: "Clang version (from AOSP)"
        required: false
        default: "r510928"
      ANYKERNEL3_REPO:
        description: "AnyKernel3 repo (user/repo)"
        required: false
        default: "osm0sis/AnyKernel3"
      ANYKERNEL3_BRANCH:
        description: "AnyKernel3 branch"
        required: false
        default: "master"
      SUSFS_ENABLED:
        description: "Patch SUSFS"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  KERNEL_SOURCE:    ${{ github.event.inputs.KERNEL_SOURCE }}
  KERNEL_BRANCH:    ${{ github.event.inputs.KERNEL_BRANCH }}
  KERNEL_DEFCONFIG: ${{ github.event.inputs.KERNEL_DEFCONFIG }}
  ARCH:             ${{ github.event.inputs.ARCH }}
  ANDROID_VERSION:  ${{ github.event.inputs.ANDROID_VERSION }}
  KERNEL_VERSION:   ${{ github.event.inputs.KERNEL_VERSION }}
  CLANG_VERSION:    ${{ github.event.inputs.CLANG_VERSION }}
  ANYKERNEL3_REPO:  ${{ github.event.inputs.ANYKERNEL3_REPO }}
  ANYKERNEL3_BRANCH: ${{ github.event.inputs.ANYKERNEL3_BRANCH }}
  SUSFS_ENABLED:    ${{ github.event.inputs.SUSFS_ENABLED }}
  BUILD_DATE:       ${{ github.run_id }}

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ─── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git kmod libelf-dev libssl-dev libc6-dev \
            lz4 python3 unzip wget zip zstd \
            libncurses-dev binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu 2>/dev/null || true
          echo "Dependencies installed."

      # ─── Toolchain ────────────────────────────────────────────────────────────
      - name: Download Clang (ZyCromerZ)
  run: |
    mkdir -p $HOME/toolchain/clang
    # Latest release tag via GitHub API
    TAG=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest \
          | grep '"tag_name"' | cut -d'"' -f4)
    URL="https://github.com/ZyCromerZ/Clang/releases/download/${TAG}/Clang-${TAG%-release}.tar.gz"
    echo "Downloading Clang $TAG from $URL"
    wget -q --show-progress "$URL" -O clang.tar.gz
    tar -xf clang.tar.gz -C $HOME/toolchain/clang
    echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH
    $HOME/toolchain/clang/bin/clang --version

      # ─── Kernel source ────────────────────────────────────────────────────────
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch "${{ env.KERNEL_BRANCH }}" \
            "https://github.com/${{ env.KERNEL_SOURCE }}" \
            kernel_src
          echo "Kernel source cloned."

      # ─── KernelSU-Next ────────────────────────────────────────────────────────
      - name: Integrate KernelSU-Next
        working-directory: kernel_src
        run: |
          echo "Integrating KernelSU-Next..."
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          # Show version
          cat KernelSU/kernel/Makefile | grep "^KERNELSU_VERSION" || true

      # ─── SUSFS (optional) ─────────────────────────────────────────────────────
      - name: Apply SUSFS patches
        if: env.SUSFS_ENABLED == 'true'
        working-directory: kernel_src
        run: |
          echo "Cloning SUSFS..."
          git clone --depth=1 \
            https://github.com/simonpunk/susfs4ksu susfs_src
          SUSFS_PATCH_DIR="susfs_src/kernel_patches"
          KSU_PATCH_DIR="susfs_src/kernel_patches/KernelSU"

          echo "Applying SUSFS kernel patches..."
          # Apply to kernel
          patch -p1 < "$SUSFS_PATCH_DIR/${{ env.ANDROID_VERSION }}_${{ env.KERNEL_VERSION }}/add_susfs_in_kernel.patch" || \
          patch -p1 --forward < "$SUSFS_PATCH_DIR/add_susfs_in_kernel.patch" || true

          # Apply to KernelSU-Next
          cd KernelSU
          patch -p1 < "../$KSU_PATCH_DIR/add_susfs_in_ksu.patch" || \
          patch -p1 --forward < "../$KSU_PATCH_DIR/next/add_susfs_in_ksu.patch" || true
          cd ..

          echo "SUSFS patches applied."

      # ─── Build ────────────────────────────────────────────────────────────────
      - name: Set up build environment
        run: |
          echo "KDIR=$GITHUB_WORKSPACE/kernel_src" >> $GITHUB_ENV
          echo "OUT=$GITHUB_WORKSPACE/out" >> $GITHUB_ENV
          mkdir -p $GITHUB_WORKSPACE/out

      - name: Build kernel
        working-directory: kernel_src
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          CC: clang
          LLVM: 1
          LLVM_IAS: 1
        run: |
          set -e
          MAKE_ARGS=(
            O=../out
            ARCH=${{ env.ARCH }}
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
            -j$(nproc --all)
          )

          echo ">>> Generating defconfig: ${{ env.KERNEL_DEFCONFIG }}"
          make "${MAKE_ARGS[@]}" ${{ env.KERNEL_DEFCONFIG }}

          echo ">>> Building kernel..."
          make "${MAKE_ARGS[@]}"

          echo "Build finished."

      - name: Locate kernel image
        id: find_image
        run: |
          BOOT_IMG=""
          # GKI: Image, Image.gz, Image.gz-dtb
          for name in Image Image.gz Image.gz-dtb Image.lz4; do
            F=$(find out/arch/${{ env.ARCH }}/boot -name "$name" 2>/dev/null | head -1)
            if [ -n "$F" ]; then
              BOOT_IMG="$F"
              break
            fi
          done
          if [ -z "$BOOT_IMG" ]; then
            echo "ERROR: No kernel image found!" && exit 1
          fi
          echo "KERNEL_IMAGE=$BOOT_IMG" >> $GITHUB_ENV
          echo "Found: $BOOT_IMG"

      # ─── AnyKernel3 zip ───────────────────────────────────────────────────────
      - name: Build AnyKernel3 zip
        run: |
          git clone --depth=1 \
            --branch "${{ env.ANYKERNEL3_BRANCH }}" \
            "https://github.com/${{ env.ANYKERNEL3_REPO }}" \
            anykernel3

          cp "$KERNEL_IMAGE" anykernel3/
          # Copy DTBs if present
          DTB_DIR="out/arch/${{ env.ARCH }}/boot/dts"
          if [ -d "$DTB_DIR" ]; then
            mkdir -p anykernel3/dtbs
            find "$DTB_DIR" -name "*.dtb" -exec cp {} anykernel3/dtbs/ \; 2>/dev/null || true
          fi
          DTBO=$(find out/arch/${{ env.ARCH }}/boot -name "dtbo.img" 2>/dev/null | head -1)
          [ -n "$DTBO" ] && cp "$DTBO" anykernel3/ || true

          cd anykernel3
          ZIP_NAME="KernelSU-Next_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}_$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP_NAME" . -x ".git/*" -x "*.placeholder"
          echo "AK3_ZIP=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV
          echo "AK3_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "Created: $ZIP_NAME"

      # ─── boot.img (GKI) ───────────────────────────────────────────────────────
      - name: Build boot.img (GKI, optional)
        id: build_boot
        continue-on-error: true
        run: |
          # Only works for GKI kernels with a stock boot.img as base
          # Requires BOOT_IMG_URL secret or file upload — skip if not set
          if [ -z "${{ secrets.BOOT_IMG_URL }}" ]; then
            echo "BOOT_IMG_URL secret not set — skipping boot.img packaging."
            echo "SKIP_BOOT=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Downloading stock boot.img..."
          wget -q "${{ secrets.BOOT_IMG_URL }}" -O stock_boot.img

          # Install magiskboot / unpackbootimg
          wget -q https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk -O Magisk.apk
          unzip -q Magisk.apk "lib/x86_64/libmagiskboot.so" -d magisk_tools
          mv magisk_tools/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

          mkdir boot_work && cd boot_work
          ../magiskboot unpack ../stock_boot.img
          cp "../$KERNEL_IMAGE" kernel
          ../magiskboot repack ../stock_boot.img ../boot_ksu.img
          echo "BOOT_IMG_PATH=$GITHUB_WORKSPACE/boot_ksu.img" >> $GITHUB_ENV
          echo "boot.img created."

      # ─── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AK3_NAME }}
          path: ${{ env.AK3_ZIP }}
          retention-days: 7

      - name: Upload boot.img
        if: env.SKIP_BOOT != 'true' && env.BOOT_IMG_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.img
          path: ${{ env.BOOT_IMG_PATH }}
          retention-days: 7

      - name: Upload kernel image (raw)
        uses: actions/upload-artifact@v4
        with:
          name: kernel_image_${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          path: ${{ env.KERNEL_IMAGE }}
          retention-days: 7

      # ─── GitHub Release (optional) ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ksu-next-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ github.run_number }}
          name: "KernelSU-Next | ${{ env.ANDROID_VERSION }} ${{ env.KERNEL_VERSION }} | #${{ github.run_number }}"
          body: |
            ## KernelSU-Next Kernel Build

            | Param | Value |
            |---|---|
            | Source | `${{ env.KERNEL_SOURCE }}@${{ env.KERNEL_BRANCH }}` |
            | Arch | `${{ env.ARCH }}` |
            | Android | `${{ env.ANDROID_VERSION }}` |
            | Kernel | `${{ env.KERNEL_VERSION }}` |
            | SUSFS | `${{ env.SUSFS_ENABLED }}` |
            | Built | `${{ github.run_id }}` |

            Flash via TWRP/Recovery with the AnyKernel3 zip, or `fastboot flash boot` with the boot.img.
          files: |
            ${{ env.AK3_ZIP }}
            ${{ env.BOOT_IMG_PATH }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

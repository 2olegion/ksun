name: Build GKI Kernel + KernelSU-Next (Pixel 10 Pro / Blazer)

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: "GKI branch (android15-6.6 / android16-6.6 etc.)"
        required: true
        default: "android15-6.6"
        type: choice
        options:
          - android15-6.6
          - android16-6.6
          - android14-6.1
      SUSFS_ENABLED:
        description: "SUSFS patchen?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      ANYKERNEL3_REPO:
        description: "AnyKernel3 repo (user/repo)"
        required: false
        default: "osm0sis/AnyKernel3"
      ANYKERNEL3_BRANCH:
        description: "AnyKernel3 branch"
        required: false
        default: "master"

env:
  ARCH: arm64
  KERNEL_BRANCH: ${{ github.event.inputs.KERNEL_BRANCH }}
  SUSFS_ENABLED: ${{ github.event.inputs.SUSFS_ENABLED }}
  ANYKERNEL3_REPO: ${{ github.event.inputs.ANYKERNEL3_REPO }}
  ANYKERNEL3_BRANCH: ${{ github.event.inputs.ANYKERNEL3_BRANCH }}

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ─── Dependencies ─────────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            kmod libelf-dev libssl-dev libc6-dev lz4 python3 \
            unzip wget zip zstd libncurses-dev \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu repo

      # ─── Clang (ZyCromerZ) ────────────────────────────────────────────────────
      - name: Download Clang
        run: |
          mkdir -p $HOME/toolchain/clang
          TAG=$(curl -fsSL "https://api.github.com/repos/ZyCromerZ/Clang/releases/latest" \
                | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          # Tag format: "16.0.6-20260510-release"
          # Tarball: "Clang-16.0.6-20260510.tar.gz"
          BARE="${TAG%-release}"
          URL="https://github.com/ZyCromerZ/Clang/releases/download/${TAG}/Clang-${BARE}.tar.gz"
          echo "Downloading Clang ${TAG}: ${URL}"
          wget -q --show-progress "${URL}" -O clang.tar.gz
          tar -xf clang.tar.gz -C $HOME/toolchain/clang
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH
          $HOME/toolchain/clang/bin/clang --version | head -1

      # ─── Kernel source (AOSP GKI common, gespiegelt via GitHub) ───────────────
      - name: Clone GKI common kernel
        run: |
          # aosp-mirror/kernel_common ist ein vollständiger Git-Mirror des AOSP common-Kernels
          git clone --depth=1 \
            --branch "${{ env.KERNEL_BRANCH }}" \
            "https://github.com/aosp-mirror/kernel_common" \
            kernel_src || \
          git clone --depth=1 \
            --branch "${{ env.KERNEL_BRANCH }}" \
            "https://android.googlesource.com/kernel/common" \
            kernel_src
          echo "Kernel source cloned: $(cd kernel_src && git log --oneline -1)"

      # ─── KernelSU-Next ────────────────────────────────────────────────────────
      - name: Integrate KernelSU-Next
        working-directory: kernel_src
        run: |
          echo "Patching KernelSU-Next into kernel tree..."
          curl -LSs \
            "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s next
          echo "KernelSU-Next version:"
          grep "^KERNELSU_VERSION" KernelSU/kernel/Makefile || true

      # ─── SUSFS ────────────────────────────────────────────────────────────────
      - name: Apply SUSFS patches
        if: env.SUSFS_ENABLED == 'true'
        working-directory: kernel_src
        run: |
          # Kernel-Version aus Branch ableiten (android15-6.6 → 6.6)
          KV=$(echo "${{ env.KERNEL_BRANCH }}" | grep -oP '\d+\.\d+$')
          # Android-Version ableiten (android15-6.6 → android15)
          AV=$(echo "${{ env.KERNEL_BRANCH }}" | grep -oP '^android\d+')
          echo "KV=$KV AV=$AV"

          git clone --depth=1 https://github.com/simonpunk/susfs4ksu susfs_src

          PDIR="susfs_src/kernel_patches"

          # Kernel patch — versuche versionsspezifisch, dann generisch
          for P in \
            "$PDIR/${AV}_${KV}/add_susfs_in_kernel.patch" \
            "$PDIR/${AV}/add_susfs_in_kernel.patch" \
            "$PDIR/add_susfs_in_kernel.patch"
          do
            if [ -f "$P" ]; then
              echo "Applying kernel patch: $P"
              patch -p1 < "$P" && break || echo "Patch failed, trying next..."
            fi
          done

          # KernelSU-Next patch
          for P in \
            "$PDIR/KernelSU/next/add_susfs_in_ksu.patch" \
            "$PDIR/KernelSU/add_susfs_in_ksu.patch"
          do
            if [ -f "$P" ]; then
              echo "Applying KSU patch: $P"
              cd KernelSU && patch -p1 < "../$P" && cd .. && break || cd .. && echo "Patch failed, trying next..."
            fi
          done

          echo "SUSFS patching done."

      # ─── Build ────────────────────────────────────────────────────────────────
      - name: Build kernel
        working-directory: kernel_src
        run: |
          set -e
          mkdir -p ../out

          MAKE_ARGS=(
            O=../out
            ARCH=arm64
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
            -j$(nproc --all)
          )

          echo ">>> Defconfig: gki_defconfig"
          make "${MAKE_ARGS[@]}" gki_defconfig

          echo ">>> Building..."
          make "${MAKE_ARGS[@]}"
          echo "Build finished."

      - name: Locate kernel image
        run: |
          for NAME in Image Image.gz Image.gz-dtb Image.lz4; do
            F=$(find out/arch/arm64/boot -name "$NAME" 2>/dev/null | head -1)
            if [ -n "$F" ]; then
              echo "KERNEL_IMAGE=$F" >> $GITHUB_ENV
              echo "Found: $F"
              exit 0
            fi
          done
          echo "ERROR: No kernel image found!" && exit 1

      # ─── AnyKernel3 zip ───────────────────────────────────────────────────────
      - name: Build AnyKernel3 zip
        run: |
          git clone --depth=1 \
            --branch "${{ env.ANYKERNEL3_BRANCH }}" \
            "https://github.com/${{ env.ANYKERNEL3_REPO }}" \
            anykernel3

          cp "$KERNEL_IMAGE" anykernel3/

          # DTBs
          DTB_DIR="out/arch/arm64/boot/dts"
          if [ -d "$DTB_DIR" ]; then
            mkdir -p anykernel3/dtbs
            find "$DTB_DIR" -name "*.dtb" -exec cp {} anykernel3/dtbs/ \; 2>/dev/null || true
          fi
          DTBO=$(find out/arch/arm64/boot -name "dtbo.img" 2>/dev/null | head -1)
          [ -n "$DTBO" ] && cp "$DTBO" anykernel3/ || true

          ZIP_NAME="KernelSU-Next_Blazer_${{ env.KERNEL_BRANCH }}_$(date +%Y%m%d)-${{ github.run_number }}.zip"
          cd anykernel3
          zip -r9 "../$ZIP_NAME" . -x ".git/*" -x "*.placeholder"
          echo "AK3_ZIP=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV
          echo "AK3_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "Created: $ZIP_NAME"

      # ─── boot.img (benötigt BOOT_IMG_URL secret) ──────────────────────────────
      - name: Build boot.img
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.BOOT_IMG_URL }}" ]; then
            echo "BOOT_IMG_URL nicht gesetzt — überspringe boot.img."
            echo "SKIP_BOOT=true" >> $GITHUB_ENV
            exit 0
          fi

          wget -q "${{ secrets.BOOT_IMG_URL }}" -O stock_boot.img

          # magiskboot aus Magisk APK extrahieren
          wget -q https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk -O Magisk.apk
          unzip -q Magisk.apk "lib/x86_64/libmagiskboot.so" -d magisk_tools
          mv magisk_tools/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

          mkdir boot_work && cd boot_work
          ../magiskboot unpack ../stock_boot.img
          cp "../$KERNEL_IMAGE" kernel
          ../magiskboot repack ../stock_boot.img ../boot_ksu.img

          echo "BOOT_IMG_PATH=$GITHUB_WORKSPACE/boot_ksu.img" >> $GITHUB_ENV
          echo "boot.img erstellt."

      # ─── Upload Artifacts ─────────────────────────────────────────────────────
      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AK3_NAME }}
          path: ${{ env.AK3_ZIP }}
          retention-days: 14

      - name: Upload boot.img
        if: env.SKIP_BOOT != 'true' && env.BOOT_IMG_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: boot_ksu_${{ env.KERNEL_BRANCH }}.img
          path: ${{ env.BOOT_IMG_PATH }}
          retention-days: 14

      - name: Upload raw kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image_${{ env.KERNEL_BRANCH }}
          path: ${{ env.KERNEL_IMAGE }}
          retention-days: 14

      # ─── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ksu-next-blazer-${{ env.KERNEL_BRANCH }}-${{ github.run_number }}
          name: "KernelSU-Next | Pixel 10 Pro (Blazer) | ${{ env.KERNEL_BRANCH }} | #${{ github.run_number }}"
          body: |
            ## KernelSU-Next — Pixel 10 Pro (Blazer / Tensor G5)

            | Param | Value |
            |---|---|
            | Kernel Branch | `${{ env.KERNEL_BRANCH }}` |
            | SUSFS | `${{ env.SUSFS_ENABLED }}` |
            | Build | `#${{ github.run_number }}` |

            ### Flash-Anleitung
            - **AnyKernel3:** Via TWRP/Recovery flashen, oder mit [KernelFlasher](https://github.com/fatalcoder524/KernelFlasher)
            - **boot.img:** `fastboot flash boot boot_ksu.img` (benötigt `BOOT_IMG_URL` Secret)

            > ⚠️ Für boot.img muss das Secret `BOOT_IMG_URL` auf einen direkten Download-Link des Stock boot.img gesetzt sein.
          files: |
            ${{ env.AK3_ZIP }}
            ${{ env.BOOT_IMG_PATH }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
